schema: spec-driven

context: |
  Auktiva is an auction platform using Next.js Pages Router, TypeScript,
  React, Tailwind CSS with DaisyUI, and Prisma. Local development uses SQLite.
  Review AGENTS.md for the worktree, agent, and frontend rules.

rules:
  design:
    - Identify shared interfaces, migration ordering, and user-visible flows.
  tasks:
    - Identify prerequisites, expected file ownership, and acceptance checks.
    - Identify tasks that can run independently and flows requiring browser QA.
    - Call out UI code changes and the required design-taste-frontend skill.
