# .github/workflows/vercel-release.yml
name: Vercel Production Deploy on Tag

on:
  push:
    tags:
      - "v*" # e.g. v1.0.0, v1.0.1, etc.

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.check-docs.outputs.docs_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # So we can check what commit the tag points to
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The release tag must point to a commit on origin/main."
            exit 1
          fi

      # Both deploy hooks build the current head of main, not the tag, so a
      # tag that is not main's head would deploy different code than it names.
      # A small race remains: main can still move between this check and the
      # moment Vercel builds the hook, and the hook always builds main's head.
      - name: Ensure tag is the head of main
        run: |
          # actions/checkout checks out the commit the tag points to.
          tag_commit=$(git rev-parse "HEAD^{commit}")
          main_commit=$(git rev-parse "origin/main^{commit}")
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "::error::The release tag points to $tag_commit, but origin/main is $main_commit. The deploy hooks build the head of main, so the tag must be main's head. Cut releases with npm run release."
            exit 1
          fi
          echo "Tag commit $tag_commit is the head of origin/main."

      - name: Trigger Vercel Deploy Hook
        run: |
          response=$(curl --fail --silent --show-error --max-time 90 \
            --request POST "$VERCEL_DEPLOY_HOOK_URL")
          job_id=$(jq -er '.job.id | strings | select(length > 0)' <<< "$response")
          echo "Vercel accepted deployment job $job_id."
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Check for docs changes
        id: check-docs
        run: |
          # Get the previous tag
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)

          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "$CURRENT_TAG" ]; then
            # No previous tag found, check against first commit
            echo "No previous tag found, assuming docs changed"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $PREVIOUS_TAG to $CURRENT_TAG"

          # Check if any files in /docs have changed between tags
          DOCS_CHANGES=$(git diff --name-only "$PREVIOUS_TAG" "$CURRENT_TAG" -- docs/ | wc -l)

          if [ "$DOCS_CHANGES" -gt 0 ]; then
            echo "Found $DOCS_CHANGES changed files in docs/"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in docs/"
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-docs:
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.docs_changed == 'true'

    steps:
      - name: Trigger Vercel Docs Deploy Hook
        run: |
          response=$(curl --fail --silent --show-error --max-time 90 \
            --request POST "$VERCEL_DOCS_DEPLOY_HOOK_URL")
          job_id=$(jq -er '.job.id | strings | select(length > 0)' <<< "$response")
          echo "Vercel accepted docs deployment job $job_id."
        env:
          VERCEL_DOCS_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DOCS_DEPLOY_HOOK_URL }}
